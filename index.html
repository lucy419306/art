<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070a0d">
  <meta name="description" content="《人类自主权恢复中心》中文版互动体验：在系统接管人生的未来，重新申请自己的选择权。">
  <title>人类自主权恢复中心｜中文版互动体验</title>
  <style>
    :root { color-scheme: dark; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; color: #e5eced; background: radial-gradient(ellipse at 50% 43%,#1a3038 0%,#0b151a 36%,#070a0d 75%); }
    body:before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .13; background: repeating-linear-gradient(0deg,transparent 0 3px,#738b91 4px); }
    .shell { width: min(100% - 40px, 1080px); min-height: 100svh; margin: auto; display: flex; flex-direction: column; position: relative; }
    header, footer { display: flex; justify-content: space-between; gap: 20px; padding: 26px 0; color: #91aab2; font-size: 14px; letter-spacing: .18em; }
    header { border-bottom: 1px solid #34474e; }
    footer { border-top: 1px solid #34474e; line-height: 1.7; }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 68px 0; max-width: 800px; }
    .eyebrow { color: #9fbec6; font: 14px monospace; letter-spacing: .22em; }
    h1 { font-size: clamp(42px,7.8vw,92px); font-weight: 300; letter-spacing: .09em; line-height: 1.2; margin: 30px 0; }
    .lead { font-size: clamp(19px,2.2vw,26px); line-height: 1.8; color: #c4d2d6; max-width: 680px; margin: 0 0 34px; }
    .detail { font-size: 16px; line-height: 1.8; color: #98afb6; max-width: 660px; margin: 0 0 42px; }
    .start { display: inline-flex; width: fit-content; min-height: 56px; align-items: center; justify-content: center; padding: 12px 32px; border: 1px solid #b9d9e3; border-radius: 4px; background: #dbeaf0; color: #102028; font-size: 17px; text-decoration: none; letter-spacing: .12em; }
    .start:hover, .start:focus-visible { background: #fff; }
    .note { margin-top: 18px; font-size: 14px; line-height: 1.6; color: #9ab0b7; }
    @media (max-width: 650px) { header,footer { flex-direction: column; gap: 6px; } main { padding: 55px 0; } }
  </style>
</head>
<body>
  <div class="shell">
    <header><span>人类自主权恢复中心</span><span>评估室 07</span></header>
    <main>
      <div class="eyebrow">CHINESE ORIGINAL · INTERACTIVE EXPERIENCE</div>
      <h1>你的人生，<br>由谁决定？</h1>
      <p class="lead">在系统替人类做决定的未来，你申请取回自己的选择权。三次模拟决策，将决定申请的去向。</p>
      <p class="detail">这是作品的原始中文版，可直接在浏览器中体验。请佩戴耳机；演出包含语音、音效与需要你亲自作答的选择。</p>
      <a class="start" href="src/">进入评估室</a>
      <div class="note">电脑可使用方向键、A / D、空格键；手机与平板可点击画面下方按钮。</div>
    </main>
    <footer><span>自主决策能力评估</span><span>完成体验后可用「重来」重新开始</span></footer>
  </div>
</body>
</html>
